info:
  contact: {}
  description: Production-grade task coordination service for AegisCrawler data collection.
  license:
    name: GPL-3.0-or-later
  title: AegisCrawler Page Agent Service
  version: 0.1.0
paths:
  /admin/audit_logs:
    get:
      description: 'Returns a paginated list of audit logs with optional filters.
        Query parameters: actor, action, resource_type, resource_id, created_after,
        created_before, limit, offset. created_after and created_before accept RFC3339
        timestamps.'
      parameters:
      - description: Filter by actor
        in: query
        name: actor
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      - description: Filter by resource ID
        in: query
        name: resource_id
        type: string
      - description: Filter by created_at >= value (RFC3339)
        in: query
        name: created_after
        type: string
      - description: Filter by created_at <= value (RFC3339)
        in: query
        name: created_before
        type: string
      - description: Page size (default 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListAuditLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: List audit logs (admin)
      tags:
      - admin
  /admin/llm/budget:
    get:
      description: Returns global and authenticated-workspace request/daily limits,
        settled amount, active reservations, remaining amount, and uncertain-call
        count. There is no API to refund, release, delete, or override a denial.
      parameters:
      - description: UTC calendar day (YYYY-MM-DD). Defaults to today.
        in: query
        name: day
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LLMBudgetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Budget ledger unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: Read LLM hard-budget state for a UTC day (admin)
      tags:
      - admin
  /admin/llm/policy:
    get:
      description: Returns the sanitized enforced-policy contract. Credentials, prompts,
        and provider response content are never included, and there is no API to mutate
        the policy.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LLMPolicyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: Read the active LLM policy (admin)
      tags:
      - admin
  /admin/mcp/tokens:
    get:
      description: Lists workspace-scoped token metadata without plaintext tokens
        or token hashes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListMCPTokensResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: List MCP bearer-token metadata
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Creates a revocable workspace-scoped MCP token. The plaintext token
        is returned only once.
      parameters:
      - description: MCP token metadata and permissions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateMCPTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.MCPTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: Create an MCP bearer token
      tags:
      - admin
  /admin/mcp/tokens/{id}:
    delete:
      parameters:
      - description: MCP token ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: Revoke an MCP bearer token
      tags:
      - admin
  /admin/rules:
    get:
      description: 'Returns a paginated list of rules with optional filters. Query
        parameters: enabled, approval_status, domain, owner, limit, offset.'
      parameters:
      - description: Filter by enabled state
        in: query
        name: enabled
        type: boolean
      - description: Filter by approval_status
        in: query
        name: approval_status
        type: string
      - description: Filter by domain raw JSON
        in: query
        name: domain
        type: string
      - description: Filter by owner
        in: query
        name: owner
        type: string
      - description: Page size (default 100)
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListRulesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: List rules (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Rule
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/models.Rule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: Create or update a rule (admin)
      tags:
      - admin
  /admin/rules/{id}:
    delete:
      description: Deletes a rule and all of its tasks, results, logs, snapshots,
        heartbeats, status updates, and checkpoints.
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - AdminApiKey: []
      summary: Delete a rule (admin)
      tags:
      - admin
    get:
      description: Returns the full rule configuration for visualization and editing.
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RuleResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get a rule by ID for admin UI
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Partially updates a rule. Only fields sent in the request body
        are modified; omitted fields remain unchanged. Uses fetch-and-merge through
        the existing upsert to preserve fields and foreign-key stability.
      parameters:
      - description: Rule ID
