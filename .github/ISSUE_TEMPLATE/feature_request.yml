name: 功能请求
description: 提议为 AegisCrawler 新增功能或改进现有功能
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚你的需求与动机。
        在提交前，请先搜索 [已有 Issue](https://github.com/singhand-labs/AegisCrawler/issues?q=is%3Aissue+label%3Aenhancement) 避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到了什么痛点？例如"我想要 X，但 AegisCrawler 只支持 Y"。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望项目如何解决这个问题？接口长什么样？DSL 怎么写？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否可以用现有能力绕过？为什么绕过方案不够好？

  - type: dropdown
    id: component
    attributes:
      label: 主要影响组件
      multiple: true
      options:
        - 服务端（Go）
        - 浏览器扩展
        - Admin UI
        - TypeScript 核心库
        - DSL schema
        - 文档
        - 其他

  - type: checkboxes
    id: terms
    attributes:
      label: 行为准则
      options:
        - label: 我已阅读 [Code of Conduct](https://github.com/singhand-labs/AegisCrawler/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: 我已确认没有其他 Issue 提出相同功能
          required: true
