name: Bug 报告
description: 报告 AegisCrawler 的可复现缺陷
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间报告 Bug！请尽量完整填写下方字段，未填写的字段可能会被自动关闭。
        在提交前，请先搜索 [已有 Issue](https://github.com/singhand-labs/AegisCrawler/issues?q=is%3Aissue+label%3Abug) 避免重复。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 可以是 release tag（如 `v0.2.0`）或 commit hash。
      placeholder: "v0.2.0 / main @ abc1234"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      multiple: true
      options:
        - 服务端（Go）
        - 浏览器扩展
        - Admin UI
        - TypeScript 核心库（rule-engine / scriptcat-engine / worker）
        - DSL schema
        - Docker 镜像
        - CI/CD
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 简明扼要地描述观察到的现象。
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: 预期发生什么
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小可复现示例最佳。
      placeholder: |
        1. 启动服务 `docker compose up -d`
        2. 上传规则 `examples/xxx.rule.yaml`
        3. 创建任务 `POST /admin/tasks ...`
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        - OS: macOS 14 / Ubuntu 22.04 / Windows 11
        - Node.js: 20.x
        - Go: 1.24.2
        - Docker: 24.x
        - 浏览器: Chrome 130
        - 是否启用 LLM 增强：否
        - 相关环境变量（请勿粘贴真实密钥，使用 `***` 掩码）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误堆栈
      description: 服务端 JSON 日志、浏览器控制台输出、`docker compose logs` 等。
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: 行为准则
      options:
        - label: 我已阅读 [Code of Conduct](https://github.com/singhand-labs/AegisCrawler/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: 我已确认没有其他 Issue 报告相同问题
          required: true
        - label: 我确认这不是一个安全漏洞（安全漏洞请按 [SECURITY.md](https://github.com/singhand-labs/AegisCrawler/blob/main/SECURITY.md) 私下披露）
          required: true
