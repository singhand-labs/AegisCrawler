name: Main integrity

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: main-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test repository integrity policy
        run: npm run test:repository-integrity

  node:
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix admin-ui

      - name: Lint and type-check
        run: npm run lint

      - name: Verify generated DSL schema
        run: |
          npm run generate-schema
          git diff --exit-code -- src/rule-engine/schemas/action.schema.json

      - name: Test root and Admin UI
        run: npm test

      - name: Test external qualification contract
        run: npm run test:external:contract

      - name: Build browser artifacts
        run: |
          npm run build:extension
          npm run package:extension
          npm run build:userscript

  go:
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install Admin UI dependencies
        run: npm ci --prefix admin-ui

      - name: Build Admin UI
        run: npm run build:admin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: server/go.sum

      - name: Test, vet, and build server
        working-directory: server
        run: |
          go test ./...
          go test -tags llm_integration ./internal/llm/... -run '^$'
          go vet ./...
          go build ./...
